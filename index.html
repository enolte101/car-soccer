<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple 3D Car Soccer (RocketGoal-style controls)</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; font-family: system-ui, sans-serif; cursor: default; }
  #ui {
    position: absolute; top: 12px; left: 12px;
    color: white; background: rgba(0,0,0,0.65);
    padding: 12px 16px; border-radius: 10px; font-size: 13px;
    pointer-events: none; user-select: none; line-height: 1.45;
    max-width: 300px;
  }
  #boostBar {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: 240px; height: 14px; background: #222; border-radius: 8px; overflow: hidden;
    border: 1px solid #555;
  }
  #boostFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #0099ff, #00eebb);
    transition: width 0.07s linear;
  }
  #hint {
    position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%);
    color: #bbb; font-size: 12px; pointer-events: none; text-align: center;
  }
</style>
</head>
<body>
<div id="ui">
  <b>RocketGoal.io-style controls</b><br><br>
  WASD / Arrows = drive<br>
  <b>Right Mouse</b> or <b>K</b> = jump (double-tap in air)<br>
  <b>Left Mouse</b> or <b>J</b> = boost<br>
  <b>Shift</b> = drift<br>
  <b>Q / E</b> = air roll<br>
  <b>Backspace</b> = reset<br>
  Esc = free mouse
</div>
<div id="boostBar"><div id="boostFill"></div></div>
<div id="hint">Click the game once to capture mouse</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// KEYBINDS – change these to whatever you want
// ============================================================
const binds = {
  forward:    'KeyW',
  back:       'KeyS',
  left:       'KeyA',
  right:      'KeyD',
  // also support arrows
  forwardAlt: 'ArrowUp',
  backAlt:    'ArrowDown',
  leftAlt:    'ArrowLeft',
  rightAlt:   'ArrowRight',

  jump:       'KeyK',          // or Right Mouse
  boost:      'KeyJ',          // or Left Mouse
  drift:      'ShiftLeft',
  rollLeft:   'KeyQ',
  rollRight:  'KeyE',
  reset:      'Backspace'
};
// ============================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 55, 150);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.15));
const dir = new THREE.DirectionalLight(0xffffff, 1.15);
dir.position.set(40, 60, 30);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = dir.shadow.camera.bottom = -70;
dir.shadow.camera.right = dir.shadow.camera.top = 70;
scene.add(dir);

// Arena
const arenaSize = 90;
const half = arenaSize / 2 - 2.2;
const wallHeight = 11;

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(arenaSize, arenaSize),
  new THREE.MeshStandardMaterial({ color: 0x2a5a28, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a });
function makeWall(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}
makeWall(arenaSize, wallHeight, 1.6, 0, wallHeight/2, -arenaSize/2);
makeWall(arenaSize, wallHeight, 1.6, 0, wallHeight/2,  arenaSize/2);
makeWall(1.6, wallHeight, arenaSize, -arenaSize/2, wallHeight/2, 0);
makeWall(1.6, wallHeight, arenaSize,  arenaSize/2, wallHeight/2, 0);

// Goals
const goalMat = new THREE.MeshStandardMaterial({ color: 0x111111, transparent: true, opacity: 0.5 });
const goal = new THREE.Mesh(new THREE.BoxGeometry(15, 8, 2.8), goalMat);
goal.position.set(0, 4, -arenaSize/2 + 1.4);
scene.add(goal);
const goal2 = goal.clone();
goal2.position.z = arenaSize/2 - 1.4;
scene.add(goal2);

// Car
const car = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.BoxGeometry(2.5, 0.7, 4.5),
  new THREE.MeshStandardMaterial({ color: 0x1e6bff, metalness: 0.35, roughness: 0.4 })
);
body.position.y = 0.55;
body.castShadow = true;
car.add(body);

const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 14);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
[[-1.2, 0.45, 1.55], [1.2, 0.45, 1.55], [-1.2, 0.45, -1.55], [1.2, 0.45, -1.55]].forEach(([x,y,z]) => {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI / 2;
  w.position.set(x, y, z);
  w.castShadow = true;
  car.add(w);
});
car.position.set(0, 0.45, 18);
scene.add(car);

// Ball
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(1.18, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.5 })
);
ball.castShadow = true;
ball.position.set(0, 1.2, 0);
scene.add(ball);

// State
const carState = {
  vel: new THREE.Vector3(),
  yawRate: 0,
  onGround: true,
  boost: 100,
  jumpsLeft: 2,
  jumpCooldown: 0,
  drifting: false
};
const ballState = { vel: new THREE.Vector3() };

// Input
const keys = {};
const prevKeys = {};
let mouseLeft = false;
let mouseRight = false;
let prevMouseRight = false;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (Object.values(binds).includes(e.code) || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === binds.reset) resetField();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

window.addEventListener('mousedown', e => {
  if (e.button === 0) mouseLeft = true;   // left = boost
  if (e.button === 2) mouseRight = true;  // right = jump
  e.preventDefault();
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) mouseLeft = false;
  if (e.button === 2) mouseRight = false;
});
window.addEventListener('contextmenu', e => e.preventDefault()); // stop right-click menu

let mouseX = 0, mouseY = 0;
let pointerLocked = false;

document.addEventListener('mousemove', e => {
  if (pointerLocked) {
    mouseX += e.movementX * 0.0017;
    mouseY += e.movementY * 0.0017;
    mouseY = THREE.MathUtils.clamp(mouseY, -0.6, 0.7);
  }
});

renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  document.body.style.cursor = pointerLocked ? 'none' : 'default';
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && document.pointerLockElement) document.exitPointerLock();
});
window.addEventListener('blur', () => {
  if (document.pointerLockElement) document.exitPointerLock();
});

function resetField() {
  car.position.set(0, 0.45, 18);
  car.quaternion.identity();
  carState.vel.set(0, 0, 0);
  carState.yawRate = 0;
  carState.onGround = true;
  carState.boost = 100;
  carState.jumpsLeft = 2;
  carState.jumpCooldown = 0;
  ball.position.set(0, 1.2, 0);
  ballState.vel.set(0, 0, 0);
  mouseX = mouseY = 0;
}

const clock = new THREE.Clock();
const tmp = new THREE.Vector3();

function isDown(code) {
  return !!keys[code];
}

function update(dt) {
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(car.quaternion);
  const right   = new THREE.Vector3(1, 0, 0).applyQuaternion(car.quaternion);
  const carUp   = new THREE.Vector3(0, 1, 0).applyQuaternion(car.quaternion);

  // Input
  const jumpJustPressed = (isDown(binds.jump) && !prevKeys[binds.jump]) || (mouseRight && !prevMouseRight);
  const boosting = (isDown(binds.boost) || mouseLeft) && carState.boost > 0;
  const drifting = isDown(binds.drift);

  let throttle = 0;
  if (isDown(binds.forward) || isDown(binds.forwardAlt)) throttle += 1;
  if (isDown(binds.back)    || isDown(binds.backAlt))    throttle -= 1;

  let steer = 0;
  if (isDown(binds.left)  || isDown(binds.leftAlt))  steer += 1;
  if (isDown(binds.right) || isDown(binds.rightAlt)) steer -= 1;

  if (boosting) carState.boost = Math.max(0, carState.boost - 32 * dt);
  else          carState.boost = Math.min(100, carState.boost + 16 * dt);
  document.getElementById('boostFill').style.width = carState.boost + '%';

  // ===== GROUND =====
  if (carState.onGround) {
    const accel = throttle * (boosting ? 58 : 36);
    carState.vel.addScaledVector(forward, accel * dt);

    // Drift makes turning sharper
    const turnSpeed = drifting ? 6.8 : 4.4;
    carState.yawRate += steer * turnSpeed * dt;
    carState.yawRate *= drifting ? 0.82 : 0.88;

    // Extra friction when drifting
    const friction = drifting ? 0.96 : 0.978;
    carState.vel.x *= friction;
    carState.vel.z *= friction;
    carState.vel.y = 0;

    // Level car
    const flatQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, car.rotation.y, 0));
    car.quaternion.slerp(flatQ, 1 - Math.pow(0.0004, dt));
  }
  // ===== AIR =====
  else {
    // Pitch with W/S + mouse look influence
    const pitch = (isDown(binds.forward) || isDown(binds.forwardAlt) ? 1 : 0) +
                  (isDown(binds.back)    || isDown(binds.backAlt)    ? -1 : 0) -
                  mouseY * 2.4;
    const yaw  = steer;
    const roll = (isDown(binds.rollLeft) ? 1 : 0) + (isDown(binds.rollRight) ? -1 : 0);

    car.rotateX(pitch * 3.4 * dt);
    car.rotateY(yaw   * 2.8 * dt);
    car.rotateZ(roll  * 3.8 * dt);

    const airForce = throttle * (boosting ? 46 : 18);
    carState.vel.addScaledVector(forward, airForce * dt);

    if (boosting) carState.vel.addScaledVector(carUp, 8 * dt);

    carState.vel.y -= 20.5 * dt;
  }

  // Jump / Double jump
  carState.jumpCooldown -= dt;
  if (jumpJustPressed && carState.jumpsLeft > 0 && carState.jumpCooldown <= 0) {
    if (carState.onGround) {
      carState.vel.y = 13.5;
      carState.onGround = false;
      carState.jumpsLeft = 1;
    } else {
      // Double jump / flip-style push in the direction the car is facing
      carState.vel.addScaledVector(carUp, 13);
      carState.jumpsLeft = 0;
    }
    carState.jumpCooldown = 0.22;
  }

  // Integrate
  car.position.addScaledVector(carState.vel, dt);

  // Ground
  if (car.position.y <= 0.45) {
    car.position.y = 0.45;
    if (carState.vel.y < 0) carState.vel.y = 0;
    carState.onGround = true;
    carState.jumpsLeft = 2;
  } else {
    carState.onGround = false;
  }

  car.position.x = THREE.MathUtils.clamp(car.position.x, -half, half);
  car.position.z = THREE.MathUtils.clamp(car.position.z, -half, half);

  if (carState.onGround) car.rotation.y += carState.yawRate * dt;

  // Ball
  ballState.vel.y -= 17.5 * dt;
  ball.position.addScaledVector(ballState.vel, dt);

  if (ball.position.y < 1.18) {
    ball.position.y = 1.18;
    ballState.vel.y *= -0.74;
    ballState.vel.x *= 0.987;
    ballState.vel.z *= 0.987;
  }
  if (Math.abs(ball.position.x) > half) {
    ball.position.x = Math.sign(ball.position.x) * half;
    ballState.vel.x *= -0.8;
  }
  if (Math.abs(ball.position.z) > half) {
    ball.position.z = Math.sign(ball.position.z) * half;
    ballState.vel.z *= -0.8;
  }

  // Car-ball collision
  const toBall = tmp.subVectors(ball.position, car.position);
  const dist = toBall.length();
  if (dist < 3.05) {
    const normal = toBall.normalize();
    const rel = carState.vel.clone().sub(ballState.vel);
    const closing = rel.dot(normal);
    const power = 1.65 + (boosting ? 0.9 : 0) + Math.min(carState.vel.length() * 0.035, 1.4);

    if (closing > -1 || dist < 2.5) {
      ballState.vel.addScaledVector(normal, Math.max(closing * power, 4.2));
      carState.vel.addScaledVector(normal, -closing * 0.2);
      ball.position.addScaledVector(normal, (3.05 - dist) * 0.6);
    }
    if (dist < 2.5 && rel.length() < 9) {
      ballState.vel.lerp(carState.vel, 0.1);
    }
  }

  // Camera
  const idealOffset = new THREE.Vector3(0, 4.0, 11);
  idealOffset.applyQuaternion(car.quaternion);
  camera.position.lerp(car.position.clone().add(idealOffset), 1 - Math.pow(0.0006, dt));

  const look = car.position.clone();
  look.y += 1.5;
  look.add(right.multiplyScalar(mouseX * 5.5));
  look.y += mouseY * 4.5;
  camera.lookAt(look);

  // Store previous
  Object.keys(keys).forEach(k => prevKeys[k] = keys[k]);
  Object.keys(prevKeys).forEach(k => { if (!keys[k]) prevKeys[k] = false; });
  prevMouseRight = mouseRight;
}

function animate() {
  requestAnimationFrame(animate);
  update(Math.min(clock.getDelta(), 0.033));
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
