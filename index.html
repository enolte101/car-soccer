<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple 3D Car Soccer</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; cursor: default; }
  #ui {
    position: absolute; top: 12px; left: 12px;
    color: white; background: rgba(0,0,0,0.55);
    padding: 10px 14px; border-radius: 8px; font-size: 14px;
    pointer-events: none; user-select: none; line-height: 1.4;
  }
  #boostBar {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 14px; background: #222; border-radius: 7px; overflow: hidden;
    border: 1px solid #444;
  }
  #boostFill {
    height: 100%; width: 100%; background: linear-gradient(90deg, #00aaff, #00ffcc);
    transition: width 0.08s linear;
  }
  #hint {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    color: #aaa; font-size: 13px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="ui">
  <b>WASD</b> = drive / air control<br>
  <b>Space</b> = jump (double-jump in air)<br>
  <b>Shift</b> = boost<br>
  <b>Q / E</b> = air roll<br>
  <b>Backspace</b> = reset field<br>
  <b>Esc</b> = unlock mouse
</div>
<div id="boostBar"><div id="boostFill"></div></div>
<div id="hint">Click the game to lock mouse • Switch tabs or press Esc to unlock</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- Setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 50, 140);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lights
const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 1.15);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(40, 60, 30);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.near = 10;
dir.shadow.camera.far = 150;
dir.shadow.camera.left = dir.shadow.camera.bottom = -60;
dir.shadow.camera.right = dir.shadow.camera.top = 60;
scene.add(dir);

// ---------- Arena ----------
const arenaSize = 90;
const half = arenaSize / 2 - 2;
const wallHeight = 10;

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(arenaSize, arenaSize),
  new THREE.MeshStandardMaterial({ color: 0x2a5a28, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Walls
const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.85 });
function wall(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}
wall(arenaSize, wallHeight, 1.5, 0, wallHeight/2, -arenaSize/2);
wall(arenaSize, wallHeight, 1.5, 0, wallHeight/2,  arenaSize/2);
wall(1.5, wallHeight, arenaSize, -arenaSize/2, wallHeight/2, 0);
wall(1.5, wallHeight, arenaSize,  arenaSize/2, wallHeight/2, 0);

// Simple goals
const goalMat = new THREE.MeshStandardMaterial({ color: 0x111111, transparent: true, opacity: 0.55 });
const g1 = new THREE.Mesh(new THREE.BoxGeometry(14, 7, 2.5), goalMat);
g1.position.set(0, 3.5, -arenaSize/2 + 1.2);
scene.add(g1);
const g2 = g1.clone();
g2.position.z = arenaSize/2 - 1.2;
scene.add(g2);

// ---------- Car ----------
const car = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e6bff, metalness: 0.3, roughness: 0.45 });
const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.65, 4.4), bodyMat);
body.position.y = 0.55;
body.castShadow = true;
car.add(body);

// Wheels
const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 14);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
[[-1.15, 0.42, 1.5], [1.15, 0.42, 1.5], [-1.15, 0.42, -1.5], [1.15, 0.42, -1.5]].forEach(p => {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI / 2;
  w.position.set(...p);
  w.castShadow = true;
  car.add(w);
});

car.position.set(0, 0.42, 18);
scene.add(car);

// ---------- Ball ----------
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(1.15, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.55, metalness: 0.05 })
);
ball.castShadow = true;
ball.position.set(0, 1.2, 0);
scene.add(ball);

// ---------- State ----------
const carState = {
  vel: new THREE.Vector3(),
  yawRate: 0,
  onGround: true,
  boost: 100,
  jumpsLeft: 2,
  jumpCooldown: 0
};

const ballState = {
  vel: new THREE.Vector3()
};

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  // prevent browser shortcuts / scrolling
  if (['KeyW','KeyA','KeyS','KeyD','Space','ShiftLeft','ShiftRight','KeyQ','KeyE','Backspace'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === 'Backspace') resetField();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let mouseX = 0, mouseY = 0;
let pointerLocked = false;

document.addEventListener('mousemove', e => {
  if (pointerLocked) {
    mouseX += e.movementX * 0.0018;
    mouseY += e.movementY * 0.0018;
    mouseY = THREE.MathUtils.clamp(mouseY, -0.55, 0.65);
  }
});

renderer.domElement.addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  document.body.style.cursor = pointerLocked ? 'none' : 'default';
});

// Unlock when tab is hidden or window loses focus
document.addEventListener('visibilitychange', () => {
  if (document.hidden && document.pointerLockElement) {
    document.exitPointerLock();
  }
});
window.addEventListener('blur', () => {
  if (document.pointerLockElement) document.exitPointerLock();
});

// ---------- Reset ----------
function resetField() {
  car.position.set(0, 0.42, 18);
  car.quaternion.set(0, 0, 0, 1);
  carState.vel.set(0, 0, 0);
  carState.yawRate = 0;
  carState.onGround = true;
  carState.boost = 100;
  carState.jumpsLeft = 2;
  carState.jumpCooldown = 0;

  ball.position.set(0, 1.2, 0);
  ballState.vel.set(0, 0, 0);

  mouseX = 0;
  mouseY = 0;
}

// ---------- Helpers ----------
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// ---------- Update ----------
const clock = new THREE.Clock();
const up = new THREE.Vector3(0, 1, 0);
const tmp = new THREE.Vector3();
const tmpQ = new THREE.Quaternion();

function update(dt) {
  // --- Orientation helpers ---
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(car.quaternion);
  const right   = new THREE.Vector3(1, 0, 0).applyQuaternion(car.quaternion);
  const carUp   = new THREE.Vector3(0, 1, 0).applyQuaternion(car.quaternion);

  // --- Input ---
  let throttle = 0;
  if (keys['KeyW']) throttle += 1;
  if (keys['KeyS']) throttle -= 1;          // S now works

  let steer = 0;
  if (keys['KeyA']) steer += 1;
  if (keys['KeyD']) steer -= 1;

  const boosting = (keys['ShiftLeft'] || keys['ShiftRight']) && carState.boost > 0;
  if (boosting) {
    carState.boost = Math.max(0, carState.boost - 28 * dt);
  } else {
    carState.boost = Math.min(100, carState.boost + 14 * dt);
  }
  document.getElementById('boostFill').style.width = carState.boost + '%';

  // --- Ground vs Air ---
  if (carState.onGround) {
    // Driving
    const accel = throttle * (boosting ? 52 : 32);
    carState.vel.addScaledVector(forward, accel * dt);

    // Steering
    carState.yawRate += steer * 4.2 * dt;
    carState.yawRate *= 0.90;

    // Friction
    carState.vel.x *= 0.982;
    carState.vel.z *= 0.982;
    carState.vel.y = 0;

    // Level the car when on ground (fixes stuck air-roll)
    const targetQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, car.rotation.y, 0));
    car.quaternion.slerp(targetQ, 1 - Math.pow(0.0008, dt));
  } else {
    // ===== AIR CONTROL (aerials + air dribble friendly) =====
    // Pitch with W/S or mouse
    const pitchInput = (keys['KeyW'] ? 1 : 0) + (keys['KeyS'] ? -1 : 0) - mouseY * 1.8;
    const yawInput   = steer;
    const rollInput  = (keys['KeyQ'] ? 1 : 0) + (keys['KeyE'] ? -1 : 0);

    // Apply rotational control
    car.rotateX(pitchInput * 2.6 * dt);   // pitch
    car.rotateY(yawInput   * 2.4 * dt);   // yaw
    car.rotateZ(rollInput  * 3.4 * dt);   // air roll

    // Air acceleration (weaker than ground)
    const airAccel = throttle * (boosting ? 38 : 14);
    carState.vel.addScaledVector(forward, airAccel * dt);

    // Boost also gives a bit of upward force when pointing up
    if (boosting) {
      carState.vel.addScaledVector(carUp, 6 * dt);
    }

    // Gravity
    carState.vel.y -= 19.5 * dt;
  }

  // --- Jump / Double Jump ---
  carState.jumpCooldown -= dt;
  if (keys['Space'] && carState.jumpCooldown <= 0 && carState.jumpsLeft > 0) {
    if (carState.onGround) {
      carState.vel.y = 12.5;
      carState.onGround = false;
      carState.jumpsLeft = 1;          // leave one for double jump
    } else {
      // Double jump – direction based on car orientation
      carState.vel.addScaledVector(carUp, 11);
      carState.jumpsLeft = 0;
    }
    carState.jumpCooldown = 0.28;
  }

  // Integrate position
  car.position.addScaledVector(carState.vel, dt);

  // Ground collision + landing
  if (car.position.y <= 0.42) {
    car.position.y = 0.42;
    if (carState.vel.y < 0) carState.vel.y = 0;
    carState.onGround = true;
    carState.jumpsLeft = 2;            // reset jumps on land
  } else {
    carState.onGround = false;
  }

  // Arena bounds (soft)
  car.position.x = clamp(car.position.x, -half, half);
  car.position.z = clamp(car.position.z, -half, half);

  // Apply yaw from ground steering
  if (carState.onGround) {
    car.rotation.y += carState.yawRate * dt;
  }

  // ---------- Ball ----------
  ballState.vel.y -= 17 * dt;
  ball.position.addScaledVector(ballState.vel, dt);

  // Floor bounce
  if (ball.position.y < 1.15) {
    ball.position.y = 1.15;
    ballState.vel.y = -ballState.vel.y * 0.72;
    ballState.vel.x *= 0.985;
    ballState.vel.z *= 0.985;
  }

  // Walls
  if (Math.abs(ball.position.x) > half) {
    ball.position.x = Math.sign(ball.position.x) * half;
    ballState.vel.x *= -0.82;
  }
  if (Math.abs(ball.position.z) > half) {
    ball.position.z = Math.sign(ball.position.z) * half;
    ballState.vel.z *= -0.82;
  }

  // ===== Car ↔ Ball collision (better for aerials & air dribbles) =====
  const toBall = tmp.subVectors(ball.position, car.position);
  const dist = toBall.length();
  const touchRadius = 2.95;

  if (dist < touchRadius) {
    const normal = toBall.normalize();
    const relVel = carState.vel.clone().sub(ballState.vel);
    const closing = relVel.dot(normal);

    // Stronger hit when boosting or moving fast
    const power = 1.55 + (boosting ? 0.7 : 0) + Math.min(carState.vel.length() * 0.04, 1.2);

    if (closing > 0 || dist < touchRadius * 0.85) {
      // Impulse
      ballState.vel.addScaledVector(normal, Math.max(closing * power, 3.5));
      // slight car recoil
      carState.vel.addScaledVector(normal, -closing * 0.18);

      // Soft separation so you can stay close for air dribbles
      const penetrate = touchRadius - dist;
      ball.position.addScaledVector(normal, penetrate * 0.55);
    }

    // Tiny “stick” help when very close and slow (helps air dribble feel)
    if (dist < 2.4 && relVel.length() < 8) {
      ballState.vel.lerp(carState.vel, 0.08);
    }
  }

  // ---------- Camera (chase + mouse look) ----------
  const idealOffset = new THREE.Vector3(0, 3.8, 10.5);
  idealOffset.applyQuaternion(car.quaternion);
  const idealPos = car.position.clone().add(idealOffset);

  camera.position.lerp(idealPos, 1 - Math.pow(0.0007, dt));

  const lookAt = car.position.clone();
  lookAt.y += 1.4;
  // mouse look offset
  lookAt.add(right.clone().multiplyScalar(mouseX * 5));
  lookAt.y += mouseY * 4;
  camera.lookAt(lookAt);
}

// ---------- Loop ----------
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  update(dt);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
